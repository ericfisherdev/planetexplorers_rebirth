name: SonarQube
on:
  push:
    branches:
      - master
    paths:
      - 'Assets/**/*.cs'
      - 'analyzers/**'
      - '.editorconfig'
      - '.github/workflows/build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Assets/**/*.cs'
      - 'analyzers/**'
      - '.editorconfig'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('analyzers/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore NuGet packages
        run: dotnet restore analyzers/PlanetExplorers.Analyzers.csproj

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"ericfisherdev_planetexplorers_rebirth" /o:"ericfisherdev-os" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build analyzers/PlanetExplorers.Analyzers.csproj --no-restore /p:EnableNETAnalyzers=false /p:RunAnalyzers=false
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
